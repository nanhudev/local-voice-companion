[pytest]
testpaths = tests
pythonpath = src
addopts = -q --strict-markers
markers =
    unit: pure-logic tests, no I/O (tests/unit)
    integration: drives the real FastAPI app over HTTP/WebSocket with fake providers (tests/integration)
    contract: pins a public wire/interface format so breaking changes fail loudly (tests/contract)
    smoke: end-to-end runtime paths and CLI entry points (tests/smoke)
    hardware: requires real inference backends; skipped by default (RULE 12)
filterwarnings =
    error::DeprecationWarning:local_voice_companion.*
